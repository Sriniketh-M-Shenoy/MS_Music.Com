name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Auto-rebuild daily at midnight IST (18:30 UTC) to pick up new YouTube uploads
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync YouTube videos & shorts (latest uploads)
        # Fetches the YouTube channel RSS feed and updates src/content/videos.js
        # so the bundled fallback is always up-to-date even before client-side fetch
        run: node scripts/sync-youtube.js
        continue-on-error: true  # Don't fail build if YouTube is temporarily unreachable

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
