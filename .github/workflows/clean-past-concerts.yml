name: Daily Cleanup Past Concerts

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prune past concerts
        run: node scripts/clean-past-concerts.js

      - name: Commit and push updated concert schedule
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain src/content/events.js) ]]; then
            git add src/content/events.js
            git commit -m "Auto: Pruned past concerts from schedule [skip ci]"
            git push
          else
            echo "No past concerts to clean."
          fi
